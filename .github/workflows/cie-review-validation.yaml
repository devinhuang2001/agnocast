name: CIE review full ROS validation

on:
  push:
    branches: [ci/cie-review-validation-9f4ec03]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ros-validation:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            ros: jazzy
          - os: ubuntu-22.04
            ros: humble
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      ROS_DISTRO: ${{ matrix.ros }}
      CMAKE_BUILD_PARALLEL_LEVEL: 2
      MAKEFLAGS: -j2
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 9f4ec038cb664dc81a866748f29fe53381b213dc
          persist-credentials: false
      - name: Install ROS and build dependencies
        shell: bash
        run: |
          set -eo pipefail
          mkdir -p validation-logs
          git rev-parse HEAD | tee validation-logs/tested-sha.txt
          uname -a | tee validation-logs/kernel.txt
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends curl ca-certificates gnupg locales build-essential cmake git pkg-config libgoogle-glog-dev liblttng-ust-dev libunwind-dev libcap2-bin linux-headers-$(uname -r)
          sudo locale-gen en_US.UTF-8
          sudo curl -fsSL https://raw.githubusercontent.com/ros/rosdistro/master/ros.key -o /usr/share/keyrings/ros-archive-keyring.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/ros-archive-keyring.gpg] http://packages.ros.org/ros2/ubuntu $(. /etc/os-release && echo "$UBUNTU_CODENAME") main" | sudo tee /etc/apt/sources.list.d/ros2.list
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ros-${ROS_DISTRO}-ros-base python3-rosdep python3-colcon-common-extensions python3-pytest
          source /opt/ros/${ROS_DISTRO}/setup.bash
          if [ ! -f /etc/ros/rosdep/sources.list.d/20-default.list ]; then sudo rosdep init; fi
          rosdep update --rosdistro ${ROS_DISTRO}
          rosdep install -y --from-paths src --ignore-src --rosdistro ${ROS_DISTRO}
          if ! command -v rustup >/dev/null; then curl --proto '=https' --tlsv1.2 -fsSL https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain 1.75.0; fi
          source "$HOME/.cargo/env"
          rustup toolchain install 1.75.0 --profile minimal
      - name: Build complete workspace and heaphook
        id: build
        shell: bash
        run: |
          set -eo pipefail
          source /opt/ros/${ROS_DISTRO}/setup.bash
          source "$HOME/.cargo/env"
          colcon build --symlink-install --executor sequential --cmake-args -DBUILD_TESTING=ON -DCMAKE_BUILD_TYPE=RelWithDebInfo 2>&1 | tee validation-logs/build.log
          cargo +1.75.0 build --manifest-path agnocast_heaphook/Cargo.toml --release 2>&1 | tee validation-logs/heaphook.log
          cp agnocast_heaphook/target/release/libagnocast_heaphook.so install/agnocastlib/lib/
      - name: Run non-module ROS tests
        id: unit
        continue-on-error: true
        shell: bash
        run: |
          set -eo pipefail
          source /opt/ros/${ROS_DISTRO}/setup.bash
          source install/setup.bash
          colcon test --packages-select agnocastlib agnocast_cie_thread_configurator --event-handlers console_direct+ --return-code-on-test-failure --ctest-args -LE 'requires_kernel_module|requires_heaphook' 2>&1 | tee validation-logs/non-module-tests.log
          colcon test-result --verbose 2>&1 | tee validation-logs/non-module-results.log
      - name: Build and load matching kernel module
        id: module
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: bash
        run: |
          set -eo pipefail
          make -C agnocast_kmod 2>&1 | tee validation-logs/kmod-build.log
          sudo insmod agnocast_kmod/agnocast.ko
          grep '^agnocast ' /proc/modules | tee validation-logs/module-loaded.txt
          test -c /dev/agnocast
          sudo chmod a+rw /dev/agnocast
      - name: Run kernel-module integration tests
        id: kernel
        if: ${{ !cancelled() && steps.module.outcome == 'success' }}
        continue-on-error: true
        shell: bash
        run: |
          set -eo pipefail
          source /opt/ros/${ROS_DISTRO}/setup.bash
          source install/setup.bash
          bash scripts/test/run_requires_kernel_module_tests.bash 2>&1 | tee validation-logs/kernel-tests.log
      - name: Run CallbackIsolatedExecutor launch and shutdown test
        id: cie
        if: ${{ !cancelled() && steps.module.outcome == 'success' }}
        continue-on-error: true
        shell: bash
        run: |
          set -eo pipefail
          source /opt/ros/${ROS_DISTRO}/setup.bash
          source install/setup.bash
          export LD_PRELOAD="$PWD/install/agnocastlib/lib/libagnocast_heaphook.so"
          launch_test src/agnocast_e2e_test/test/functional/test_agnocast_callback_isolated_executor_launch.py 2>&1 | tee validation-logs/cie-launch.log
      - name: Run all 1-to-1 E2E combinations
        id: one
        if: ${{ !cancelled() && steps.module.outcome == 'success' }}
        continue-on-error: true
        shell: bash
        run: |
          set -eo pipefail
          source /opt/ros/${ROS_DISTRO}/setup.bash
          source install/setup.bash
          bash scripts/test/e2e_test_1to1.bash -c -p 2 2>&1 | tee validation-logs/e2e-1to1.log
      - name: Run all 2-to-2 E2E combinations
        id: two
        if: ${{ !cancelled() && steps.module.outcome == 'success' }}
        continue-on-error: true
        shell: bash
        run: |
          set -eo pipefail
          source /opt/ros/${ROS_DISTRO}/setup.bash
          source install/setup.bash
          bash scripts/test/e2e_test_2to2.bash -c 2>&1 | tee validation-logs/e2e-2to2.log
      - name: Collect diagnostics
        if: always()
        shell: bash
        run: |
          mkdir -p validation-logs
          sudo dmesg > validation-logs/dmesg.log || true
          cp -r /tmp/e2e_1to1_logs validation-logs/ 2>/dev/null || true
          if [ -f install/setup.bash ]; then
            source /opt/ros/${ROS_DISTRO}/setup.bash
            source install/setup.bash
            colcon test-result --verbose > validation-logs/test-results.log 2>&1 || true
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cie-review-validation-${{ matrix.ros }}
          path: |
            validation-logs/
            build/*/test_results/
            log/
          retention-days: 14
      - name: Require all validation steps to pass
        if: always()
        env:
          BUILD_RESULT: ${{ steps.build.outcome }}
          UNIT_RESULT: ${{ steps.unit.outcome }}
          MODULE_RESULT: ${{ steps.module.outcome }}
          KERNEL_RESULT: ${{ steps.kernel.outcome }}
          CIE_RESULT: ${{ steps.cie.outcome }}
          ONE_RESULT: ${{ steps.one.outcome }}
          TWO_RESULT: ${{ steps.two.outcome }}
        run: |
          for result in "$BUILD_RESULT" "$UNIT_RESULT" "$MODULE_RESULT" "$KERNEL_RESULT" "$CIE_RESULT" "$ONE_RESULT" "$TWO_RESULT"; do
            if [ "$result" != success ]; then echo "Validation did not fully pass: $result"; exit 1; fi
          done
